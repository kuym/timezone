<html>
<head>
	<meta charset="utf-8">
	<title>Timezone quadtree viewer</title>
	<style>
		body { font-family: system-ui, sans-serif; margin: 16px; }
		canvas { border: 1px solid #ccc; cursor: crosshair; display: block; }
		#readout { margin-top: 8px; font-family: ui-monospace, monospace; font-size: 13px;
		           white-space: pre; min-height: 6em; }
		#controls { margin-bottom: 8px; font-size: 13px; }
		#controls label { margin-right: 14px; }
		.tz { font-weight: bold; }
		.definite { color: #0a7d28; }
		.pip { color: #9a5b00; }
		.none { color: #888; }
	</style>
</head>
<body>
	<div id="controls">
		<label><input type="checkbox" id="showQuadtree" checked> quadtree cells</label>
		<label><input type="checkbox" id="showPolygons" checked> polygons</label>
		<label><input type="checkbox" id="showErefs" checked> shade definitive (eref) cells</label>
	</div>
	<canvas width="1600" height="800" style="width:800px; height:400px"></canvas>
	<div id="readout">loading quadtree.json...</div>

	<script type="text/javascript" src="geom.js"></script>
	<script type="text/javascript" src="polycodec.js"></script>
	<script type="text/javascript" src="tzlookup.js"></script>
	<script type="text/javascript">
		"use strict";

		let db = null;
		let mat = null;
		let arcs = null; // decoded shared boundary arcs (topology artifact)

		// Forward transform from quantized units to canvas pixels.  Both axes use
		// the same scale (the domain is 2:1, matching 360 x 180 degrees), so the
		// projection is plate carree at 1:1 degree scale.  y is negated so north
		// is up.
		function makeMatrix(canvas, rootCell) {
			const w = canvas.width, h = canvas.height;
			const xm = w / (rootCell[1][0] - rootCell[0][0]);
			const ym = -h / (rootCell[1][1] - rootCell[0][1]);
			return {
				xm: xm, ym: ym,
				xs: w / 2, ys: h / 2,
				toScreen: function(p) { return [p[0] * xm + w / 2, p[1] * ym + h / 2]; },
				toWorld: function(sx, sy) {
					return [Math.round((sx - w / 2) / xm), Math.round((sy - h / 2) / ym)];
				}
			};
		}

		function tracePoly(c2d, poly) {
			if (poly.length == 0) { return; }
			// Draw every vertex exactly once.  The original render() consumed
			// vertex 0 for the moveTo and then started its lineTo loop at index 0
			// again, double-counting the first delta and shifting the whole shape.
			let s = mat.toScreen(poly[0]);
			c2d.moveTo(s[0], s[1]);
			for (let i = 1; i < poly.length; i++) {
				s = mat.toScreen(poly[i]);
				c2d.lineTo(s[0], s[1]);
			}
			c2d.closePath();
		}

		function drawPolygons(c2d) {
			c2d.strokeStyle = "rgba(0, 0, 0, 0.75)";
			c2d.lineWidth = 1;
			c2d.beginPath();
			for (let i = 0; i < db.zones.length; i++) {
				const rings = tzlookup.zoneRings(db.zones[i], arcs);
				tracePoly(c2d, rings.outer);
				for (let j = 0; j < rings.holes.length; j++) {
					tracePoly(c2d, rings.holes[j]);
				}
			}
			c2d.stroke();
		}

		function drawQuadtree(c2d, shadeErefs) {
			c2d.lineWidth = 0.5;

			(function renderNode(node, cell) {
				const hasEref = node.eref && node.eref.length > 0;
				const hasRef = node.ref && node.ref.length > 0;

				if (hasEref || hasRef) {
					const a = mat.toScreen(cell[0]), b = mat.toScreen(cell[1]);
					if (hasEref && shadeErefs) {
						// Cells a zone provably covers in full: resolved with no
						// geometry test at all.
						c2d.fillStyle = "rgba(0, 160, 60, 0.18)";
						c2d.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
					}
					c2d.strokeStyle = hasEref ? "rgba(0, 120, 40, 0.7)" : "rgba(200, 0, 0, 0.5)";
					c2d.strokeRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
				}

				if (node.q) {
					for (let i = 0; i < node.q.length; i++) {
						renderNode(node.q[i], tzlookup.splitCell(cell, i));
					}
				}
			})(db.quadtree, db.rootCell);
		}

		let highlight = null;

		function redraw() {
			const canvas = document.getElementsByTagName("canvas")[0];
			const c2d = canvas.getContext("2d");
			// Clear once, here, so the layers actually compose.  Both of the old
			// render functions reset canvas.width on entry, which cleared the
			// canvas and made it impossible to draw one over the other.
			c2d.clearRect(0, 0, canvas.width, canvas.height);

			if (document.getElementById("showQuadtree").checked) {
				drawQuadtree(c2d, document.getElementById("showErefs").checked);
			}
			if (document.getElementById("showPolygons").checked) {
				drawPolygons(c2d);
			}
			if (highlight) {
				const rings = tzlookup.zoneRings(highlight, arcs);
				c2d.fillStyle = "rgba(0, 90, 220, 0.35)";
				c2d.strokeStyle = "rgba(0, 60, 180, 0.9)";
				c2d.lineWidth = 1.5;
				c2d.beginPath();
				tracePoly(c2d, rings.outer);
				for (let j = 0; j < rings.holes.length; j++) {
					tracePoly(c2d, rings.holes[j]);
				}
				c2d.fill("evenodd");
				c2d.stroke();
			}
		}

		function fmt(n, digits) { return n.toFixed(digits === undefined ? 3 : digits); }

		function onMove(ev) {
			if (!db) { return; }
			const canvas = document.getElementsByTagName("canvas")[0];
			const r = canvas.getBoundingClientRect();
			const sx = (ev.clientX - r.left) * (canvas.width / r.width);
			const sy = (ev.clientY - r.top) * (canvas.height / r.height);
			const point = mat.toWorld(sx, sy);

			const res = tzlookup.resolve(db, point);
			const lon = point[0] / db.quant.xScale, lat = point[1] / db.quant.yScale;

			let cls = "none", label = "(no timezone - ocean or unmapped)";
			if (res.zone) {
				cls = res.definite ? "definite" : "pip";
				label = db.tzById[res.zone.tzid].n;
			}

			// Show what the quadtree narrowed the search to, and how the answer
			// was reached: `eref` needs no geometry test; each `ref` candidate is
			// tested against only the ring edges that cross this leaf cell.  Each
			// name is annotated with (evaluated / full) ring vertices, showing how
			// much the per-leaf localization saved for that candidate.
			const arcLen = function(ref) { return arcs[ref < 0 ? -ref - 1 : ref].length; };
			const cand = res.probe.candidates.map(function(c) {
				const z = db.zones[c.z];
				let evald = 0, touched = 0;
				(c.e || []).forEach(function(ar) {
					touched += arcLen(z.outer[ar[0]]);
					ar[1].forEach(function(r) { evald += r[1] - r[0] + 1; });
				});
				(c.h || []).forEach(function(hc) {
					(hc.e || []).forEach(function(ar) {
						touched += arcLen(z.h[hc.i][ar[0]]);
						ar[1].forEach(function(r) { evald += r[1] - r[0] + 1; });
					});
				});
				const rings = tzlookup.zoneRings(z, arcs);
				let full = rings.outer.length;
				rings.holes.forEach(function(h) { full += h.length; });
				// edges evaluated, and arc vertices actually decoded vs the full ring.
				return db.tzById[z.tzid].n + " (" + evald + " edges, " + touched + "/" + full + " arc verts)";
			});

			// Cost to resolve this point, matching tzlookup_binary.js's accounting:
			//   1 op per quadtree level descended;
			//   1 op per arc vertex decoded to rebuild each candidate's ring from
			//     the shared arcs (usually the dominant cost with topology geometry);
			//   2 ops per ring edge evaluated in the localized point-in-polygon test.
			const s = res.stats;
			const recon = s.reconVertices || 0;
			const total = s.depth + recon + 2 * s.vertices;

			document.getElementById("readout").innerHTML =
				'<span class="tz ' + cls + '">' + label + '</span>' +
				(res.zone ? (res.definite ?
					'   resolved from eref, no polygon test needed' :
					'   resolved by point-in-polygon test') : '') + '\n' +
				'lon ' + fmt(lon) + '  lat ' + fmt(lat) +
				'   (quantized ' + point[0] + ', ' + point[1] + ')\n' +
				'quadtree path: ' + (res.probe.path.join("") || "(root)") +
				'   depth ' + res.probe.path.length +
				'   cell [' + res.probe.cell[0] + '] .. [' + res.probe.cell[1] + ']\n' +
				'definitive (eref): ' + res.probe.definite.length +
				'   candidates (ref): ' + res.probe.candidates.length +
				(cand.length ? '  -> ' + cand.join(", ") : '') + '\n' +
				'<b>cost</b>: descent ' + s.depth + ' + ring reconstruction ' + recon +
				' arc verts + localized test ' + (2 * s.vertices) + ' (' + s.vertices + ' edges)' +
				(s.fallbacks ? ' (' + s.fallbacks + ' full-ring fallback)' : '') +
				'  =  ' + total + ' ops';

			const newHighlight = res.zone || null;
			if (newHighlight !== highlight) { highlight = newHighlight; redraw(); }
		}

		fetch("quadtree.json")
			.then(function(r) {
				if (!r.ok) { throw Error("HTTP " + r.status + " loading quadtree.json"); }
				return r.json();
			})
			.then(function(data) {
				db = data;
				// Decode the shared boundary arcs once (topology artifact); older
				// artifacts without `arcs` decode to [] and zoneRings falls back to
				// the per-zone o/p packing.
				arcs = tzlookup.decodeArcs(db);
				// Index timezones by numeric id for the readout.
				db.tzById = {};
				for (const name in db.tz) { db.tzById[db.tz[name].id] = db.tz[name]; }

				const canvas = document.getElementsByTagName("canvas")[0];
				mat = makeMatrix(canvas, db.rootCell);

				["showQuadtree", "showPolygons", "showErefs"].forEach(function(id) {
					document.getElementById(id).addEventListener("change", redraw);
				});
				canvas.addEventListener("mousemove", onMove);

				redraw();
				document.getElementById("readout").textContent =
					"loaded " + db.zones.length + " polygons in " +
					Object.keys(db.tz).length + " timezones - move the mouse over the map";
			})
			.catch(function(e) {
				document.getElementById("readout").textContent =
					"Failed to load quadtree.json: " + e.message +
					"\n\nquadtree.json is fetched over HTTP, so serve this directory rather " +
					"than opening the file directly:\n    python3 -m http.server 8000";
			});
	</script>
</body>
</html>
