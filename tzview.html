		function polyAABB(v) {
			const aabb = {
				xl: Infinity,
				xh: -Infinity,
				yl: Infinity,
				yh: -Infinity,
			};
			const p = {
				x: 0,
				y: 0,
			};
			for(let i = 0; i < v.length; i++) {
				p.x += v[i][0];
				p.y += v[i][1];
				if(p.x < aabb.xl) { aabb.xl = p.x; }
				if(p.x > aabb.xh) { aabb.xh = p.x; }
				if(p.y < aabb.yl) { aabb.yl = p.y; }
				if(p.y > aabb.yh) { aabb.yh = p.y; }
			}
			return aabb;
		}
		function render(v, m) {
			const canvas = document.getElementsByTagName("canvas")[0];
			const canvasRect = canvas.getBoundingClientRect();
			const dpr = window.devicePixelRatio || 1;
			canvas.width = canvasRect.width * dpr;
			canvas.height = canvasRect.height * dpr;
			const c2d = canvas.getContext("2d");
			c2d.scale(dpr, dpr);

			c2d.strokeStyle = "black";
			c2d.beginPath();
			const p = {
				x: 0,
				y: 0,
			};
			c2d.moveTo((p.x = (p.x + v[0][0])) * m.xm + m.xs, (p.y = (p.y + v[0][1])) * m.ym + m.ys);
			for(let i = 0; i < v.length; i++) {
				c2d.lineTo((p.x = (p.x + v[i][0])) * m.xm + m.xs, (p.y = (p.y + v[i][1])) * m.ym + m.ys);
			}
			c2d.stroke();
		}
		
		function splitCell(cell, quadrant) {
			const mx = parseInt((cell[0][0] + cell[1][0]) / 2), my = parseInt((cell[0][1] + cell[1][1]) / 2);
			switch(quadrant) {
			case 0: return([[mx, my], [cell[1][0], cell[1][1]]]);
			case 1: return([[cell[0][0], my], [mx, cell[1][1]]]);
			case 2: return([[cell[0][0], cell[0][1]], [mx, my]]);
			case 3: return([[mx, cell[0][1]], [cell[1][0], my]]);
			}
		}

		function renderQuadtree(qt, mat) {
			const canvas = document.getElementsByTagName("canvas")[0];
			const canvasRect = canvas.getBoundingClientRect();
			const dpr = window.devicePixelRatio || 1;
			canvas.width = canvasRect.width * dpr;
			canvas.height = canvasRect.height * dpr;
			const c2d = canvas.getContext("2d");
			c2d.scale(dpr, dpr);
			//c2d.transform(mat.xm, 0, 0, mat.ym, mat.xs, mat.ys);
			
			function renderNode(c2d, node, cell) {
				if((node.eref && (node.eref.length > 0)) || (node.ref && (node.ref.length > 0))) {
					c2d.strokeStyle = "black";
					c2d.fillStyle = "red";
					c2d.beginPath();
					c2d.moveTo(cell[0][0] * mat.xm + mat.xs, cell[0][1] * mat.ym + mat.ys);
					c2d.lineTo(cell[1][0] * mat.xm + mat.xs, cell[0][1] * mat.ym + mat.ys);
					c2d.lineTo(cell[1][0] * mat.xm + mat.xs, cell[1][1] * mat.ym + mat.ys);
					c2d.lineTo(cell[0][0] * mat.xm + mat.xs, cell[1][1] * mat.ym + mat.ys);
					c2d.lineTo(cell[0][0] * mat.xm + mat.xs, cell[0][1] * mat.ym + mat.ys);
					c2d.stroke();
				}

				if(node.q) {
					node.q.forEach(function(q, i) {
						renderNode(c2d, q, splitCell(cell, i));
					});
				}
			}

			renderNode(c2d, qt, [[-524288, -262144], [524287, 262143]]);
		}

		function probeTZPoint(quadtree, point) {
			const path = [];
		  function probeTZPointInternal(node, cell, point) {
		    const hits = [];
		    if (node.eref) {
		      hits.push.apply(hits, node.eref);
		    }
		    if (node.ref) {
		      hits.push.apply(hits, node.ref);
		    }
		    if (node.q && node.q.length > 0) {
		      const q0 = splitCell(cell, 0);
		      //console.log("path:", path, "node", node);
		      if (point[0] >= q0[0][0]) {
		        if (point[1] >= q0[0][1]) {
		          path.push(0);
		          const probe = probeTZPointInternal(node.q[0], splitCell(cell, 0), point);
		          hits.push.apply(hits, probe.hits);
		        } else {
		          path.push(1);
		          const probe = probeTZPointInternal(node.q[3], splitCell(cell, 3), point);
		          hits.push.apply(hits, probe.hits);
		        }
		      } else {
		        if (point[1] >= q0[0][1]) {
		          path.push(2);
		          const probe = probeTZPointInternal(node.q[1], splitCell(cell, 1), point);
		          hits.push.apply(hits, probe.hits);
		        } else {
		          path.push(3);
		          const probe = probeTZPointInternal(node.q[2], splitCell(cell, 2), point);
		          hits.push.apply(hits, probe.hits);
		        }
		      }
		    }
		    return {hits:hits, path:path};
		  }

		  return probeTZPointInternal(quadtree, [[-524288, -262144], [524287, 262143]], point);
		}


		document.getElementsByTagName("canvas")[0].onmousemove = function(e){
			const screenPoint = [e.offsetX, e.offsetY];
			const invMat = {xm: 524288/400, xs: -524288, ym: -524288/400, ys: 262144};
			const p = [screenPoint[0] * invMat.xm + invMat.xs, screenPoint[1] * invMat.ym + invMat.ys];

			const probe = probeTZPoint(qt, p);
			const zones = [...new Set(probe.hits.map(v => zLookup[v]))];
			const zoneNames = zones.map(function(v){return z[v];});

			//console.log(probe);
			document.getElementById("readout").innerHTML = [

				[parseInt(p[0]) * 180/524288, parseInt(p[1]) * 180/524288],
				"[" + zoneNames.join(", ") + "]",
				probe.path.join(">")
			].join(" : ");
		}
