[package]
name = "tzconvert"
version = "0.1.0"
edition = "2021"
description = "Timezone quadtree compressor — Rust port of tzconvert.js"

[[bin]]
name = "tzconvert"
path = "src/main.rs"

# serde_json is used only to parse the input GeoJSON.  The output serializers are
# hand-written (see src/serialize) so the format is fully under our control and
# the JSON / binary implementations share one interface.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
